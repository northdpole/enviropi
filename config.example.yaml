# Copy to config.yaml and adjust. Secrets go in .env.

poll_interval_sec: 60
raw_retention_days: 14
# Public link used in Telegram alerts. Prefer ENVIROPI_TAILSCALE_HOST / ENVIROPI_DASHBOARD_URL
# in .env so personal MagicDNS is not committed; this is only a fallback default.
dashboard_url: "http://127.0.0.1:8000"

# CPU temperature compensation factor (Pimoroni default ~2.25)
temp_compensation_factor: 2.25

# Hysteresis: how far back inside the limit before a breach is considered resolved
hysteresis:
  temperature: 0.5
  humidity: 2.0
  pressure: 1.0
  gas_reducing: 1000
  gas_oxidising: 1000
  gas_nh3: 1000
  noise: 0.05
  lux: 50

# Twice-daily Telegram digest with current readings + period highs/lows
# Override times live via Telegram: /digest 08:00 20:00
status_report:
  enabled: true
  times: ["08:00", "20:00"]
  timezone: "Europe/London"

# Immediate alerts on sudden spikes (bypasses mute). Enviro+ has no PM sensor;
# gas resistance jumps stand in for extreme particulate / smoke-like events.
catastrophe:
  enabled: true
  window_min: 5
  temperature_rise: 5.0      # °C within window → possible fire / extreme heat
  humidity_rise: 25.0        # %RH within window → possible flooding / steam
  pressure_drop: 8.0         # hPa drop within window (null to disable)
  gas_drop_pct: 35.0         # reducing / NH3 resistance drop %
  gas_rise_pct: 35.0         # oxidising resistance rise %
  lux_rise: null             # optional lux jump; null = off
  cooldown_sec: 600          # min seconds between repeat catastrophe msgs per metric

# Gas sensor: wait this long after process start before relative baseline alerts
gas:
  baseline_warmup_min: 30
  # Optional: alert if reading moves this % from rolling baseline (null = off)
  relative_change_pct: null

# Thresholds: null disables that side of the alert.
# Limit alerts fire once on breach and once when resolved (not every poll).
# Gas values are resistance in Ohms.
# Reducing / NH3: LOWER resistance = MORE gas -> alert when value <= high (treated as "bad" ceiling inverted).
# For reducing/NH3 we use .high as the minimum resistance (alert when reading drops below it).
# Oxidising: HIGHER resistance = MORE NO2-like -> alert when value >= high.
temperature:
  high: 28.0
  low: 10.0
humidity:
  high: 70.0
  low: 30.0
pressure:
  high: null
  low: null
gas_reducing:
  # Alert when resistance falls below this (more reducing gases / CO-like)
  high: null
gas_oxidising:
  high: null
gas_nh3:
  high: null
noise:
  high: null
lux:
  high: null
  low: null

# Prefer TELEGRAM_ALLOWLIST / TELEGRAM_ALERT_CHAT_ID in .env (not personal ids here).
# If empty, a positive TELEGRAM_ALERT_CHAT_ID is auto-allowed for commands.
telegram_allowlist: []

# Send a one-shot Telegram message when the collector starts
notify_on_startup: true
