[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enviropi"
version = "0.1.0"
description = "Enviro+ dashboard, history, and Telegram alerts for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2.0",
    "authlib>=1.3.2",
    "httpx>=0.27.0",
    "python-telegram-bot>=21.6",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
hardware = [
    "enviroplus",
    "smbus2",
    "RPi.GPIO",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
enviropi-collector = "enviropi.collector:main"
enviropi-web = "enviropi.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enviropi = ["web/templates/*.html", "web/static/*"]
